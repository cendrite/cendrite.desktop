name: CI - Electron App

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint

      - name: Build React App
        run: npm run build

      - name: Transpile Electron Code
        run: npm run transpile:electron

      - name: list contents after transpile
        run: |
          echo "=== $(pwd) ==="
          ls -la
          echo "=== dist-electron ==="
          ls -la dist-electron


      - name: Upload Transpiled Electron Code
        uses: actions/upload-artifact@v4
        with:
          name: electron-dist
          path: dist-electron

  test-integration:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Download Transpiled Electron Code
        uses: actions/download-artifact@v4
        with:
         name: electron-dist
         path: dist-electron

      - name: list dist-electron
        run: |
          echo "=== dist-electron contents ==="
           ls -la dist-electron
          find dist-electron
    
      - name: list electron
        run: npm list electron
    
      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Run Playwright Tests
        run: npm run test:integration

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  test-unit:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Run Vitest Tests
        run: npm run test:unit
