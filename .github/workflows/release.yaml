name: Build_and_Publish_Electron_App

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: write

jobs:
  build_and_upload:
    name: Build and upload ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: windows
            os: windows-latest
            buildScript: dist:win
            glob: '*.exe *.msi *.yml'
            id: 0
          - name: macos
            os: macos-latest
            buildScript: dist:mac
            glob: '*.dmg *.blockmap *.yml'
            id: 1
          - name: linux
            os: ubuntu-latest
            buildScript: dist:linux
            glob: '*.AppImage *.deb *.yml'
            id: 2

    env:
      API_URL:    ${{ secrets.RELEAF_API_URL }}
      PUBLIC_KEY: ${{ secrets.RELEAF_PUBLIC_KEY }}
      UPLOAD_KEY: ${{ secrets.RELEAF_UPLOAD_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run ${{ matrix.platform.buildScript }}

      - name: List artifacts
        run: echo Artifacts in dist/:; ls -1 dist

      - name: Upload artifacts
        run: |
          for pattern in ${{ matrix.platform.glob }}; do \
            for file in dist/$pattern; do \
              if [ -f "$file" ]; then \
                echo "Uploading $file for platform ${{ matrix.platform.id }}"; \
                curl --fail -X POST "${API_URL}/create" \
                  -H "XReleafAppKey: ${PUBLIC_KEY}" \
                  -H "XReleafUploadKey: ${UPLOAD_KEY}" \
                  -F version="v${{ github.run_number }}" \
                  -F name="$(basename "$file")" \
                  -F platform=${{ matrix.platform.id }} \
                  -F file=@"$file"; \
              fi; \
            done; \
          done
