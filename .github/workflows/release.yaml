name: Release Electron App

on:
  push:
    tags:
      - 'v*'    # best practice: only on real version tags

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: windows
            os: windows-latest
            buildScript: dist:win
            glob: '*.exe'
            id: 0

          - name: macos
            os: macos-latest
            buildScript: dist:mac
            glob: '*.dmg'
            id: 1

          - name: linux
            os: ubuntu-latest
            buildScript: dist:linux
            glob: '*.AppImage'
            id: 2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron App (${{ matrix.platform.name }})
        run: npm run ${{ matrix.platform.buildScript }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name:     "Release ${{ github.ref_name }} — ${{ matrix.platform.name }}"
          files:    dist/${{ matrix.platform.glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
