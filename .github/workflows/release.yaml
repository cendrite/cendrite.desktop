name: Release Electron App

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: write  # for GH Releases

jobs:
  release:
    name: Build & Release (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: windows
            os: windows-latest
            buildScript: dist:win
            glob: '*.exe'
            id: 0

          - name: macos
            os: macos-latest
            buildScript: dist:mac
            glob: '*.dmg'
            id: 1

          - name: linux
            os: ubuntu-latest
            buildScript: dist:linux
            glob: '*.AppImage'
            id: 2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron App (${{ matrix.platform.name }})
        run: npm run ${{ matrix.platform.buildScript }}

      - name: Find installer
        id: find
        run: |
          installer=$(find dist -maxdepth 1 -type f -name "${{ matrix.platform.glob }}" | head -n1)
          echo "installer=$installer" >> $GITHUB_OUTPUT

      - name: Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.run_number }} (${{ matrix.platform.name }})"
          files: ${{ steps.find.outputs.installer }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
