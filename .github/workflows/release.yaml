name: Release Electron App

on:
  push:
    branches:
      - develop
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Electron App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Electron App
        run: npm run dist:${{ matrix.os == 'windows-latest' && 'win' || matrix.os == 'macos-latest' && 'mac' || 'linux' }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: dist/

  release-windows:
    name: Release Windows
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-latest-artifact
          path: ./release/windows

      - name: Filter Windows Files
        run: |
          mkdir selected
          cp release/windows/*.exe selected/ || true
          cp release/windows/*.msi selected/ || true
          cp release/windows/latest.yml selected/ || true
          ls -lh selected

      - name: Release Windows Build
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.run_number }}"
          draft: false
          prerelease: false
          files: selected/*

  release-macos:
    name: Release macOS
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-latest-artifact
          path: ./release/macos

      - name: Filter macOS Files
        run: |
          mkdir selected
          cp release/macos/*.dmg selected/ || true
          cp release/macos/*.blockmap selected/ || true
          cp release/macos/latest-mac.yml selected/ || true
          ls -lh selected

      - name: Release macOS Build
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.run_number }}"
          draft: false
          prerelease: false
          files: selected/*

  release-linux:
    name: Release Linux
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-latest-artifact
          path: ./release/linux

      - name: Filter Linux Files
        run: |
          mkdir selected
          cp release/linux/*.AppImage selected/ || true
          cp release/linux/*.deb selected/ || true
          cp release/linux/latest-linux.yml selected/ || true
          ls -lh selected

      - name: Release Linux Build
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.run_number }}"
          draft: false
          prerelease: false
          files: selected/*
