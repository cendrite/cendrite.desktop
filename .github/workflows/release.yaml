name: Release Electron App (no‑artifacts)

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: write   # needed for pushing the release

env:
  NODE_VERSION: 20

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          # ——— Windows ———
          - os: windows-latest
            build_cmd: npm run dist:win
            asset_glob: |
              dist/*.exe
              dist/*.msi
              dist/latest.yml
          # ——— macOS ———
          - os: macos-latest
            build_cmd: npm run dist:mac
            asset_glob: |
              dist/*.dmg
              dist/*.blockmap
              dist/latest-mac.yml
          # ——— Linux ———
          - os: ubuntu-latest
            build_cmd: npm run dist:linux
            asset_glob: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: ${{ matrix.build_cmd }}

      # The first job (Ubuntu here) creates the release; the remaining jobs
      # just attach their assets to the same tag.
      - name: Create or update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.run_number }}"
          draft: false
          prerelease: false
          update_release: true          # idempotent — OK if the tag already exists
          files: ${{ matrix.asset_glob }}
