name: Build_and_Publish_Electron_App

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: write

jobs:
  build_and_upload:
    name: Build and upload ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: windows
            os: windows-latest
            buildScript: dist:win
            glob: '*.exe'
            id: 0

          - name: macos
            os: macos-latest
            buildScript: dist:mac
            glob: '*.dmg'
            id: 1

          - name: linux
            os: ubuntu-latest
            buildScript: dist:linux
            glob: '*.AppImage'
            id: 2

    env:
      API_URL:    ${{ secrets.RELEAF_API_URL }}
      PUBLIC_KEY: ${{ secrets.RELEAF_PUBLIC_KEY }}
      UPLOAD_KEY: ${{ secrets.RELEAF_UPLOAD_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run ${{ matrix.platform.buildScript }}

      - name: List artifacts
        run: |
          echo "Artifacts in dist/:"
          ls -1 dist

      - name: Upload installer in chunks
        run: |
          set -e

          # find the installer
          installer=$(find dist -maxdepth 1 -type f -name "${{ matrix.platform.glob }}" | head -n1)
          if [[ -z "$installer" ]]; then
            echo "❌ No installer matching '${{ matrix.platform.glob }}' found"
            exit 1
          fi
          echo "📦 Installer: $installer"

          # derive identifiers
          version="v${GITHUB_RUN_NUMBER}"
          releaseId="release-${GITHUB_RUN_NUMBER}"
          fileName=$(basename "$installer")
          platform=${{ matrix.platform.id }}

          echo "🔑 releaseId=$releaseId"
          echo "🔢 Splitting into 50MiB chunks…"

          # split into ~50MiB slices
          split -b 50m "$installer" "${installer}.part_"
          parts=( $(ls "${installer}.part_"*) )

          # upload each chunk
          idx=0
          for part in "${parts[@]}"; do
            echo "➡️ Uploading chunk #$idx ($part)"
            curl --fail -X POST "${API_URL}/upload/chunk" \
              -H "X-Releaf-App-Key: ${PUBLIC_KEY}" \
              -H "X-Releaf-Upload-Key: ${UPLOAD_KEY}" \
              -F "releaseId=${releaseId}" \
              -F "chunkId=${idx}" \
              -F "file=@${part}"
            ((idx++))
          done

          # tell the server to assemble & finish
          echo "🔄 Completing upload"
          curl --fail -X POST "${API_URL}/upload/complete" \
            -H "X-Releaf-App-Key: ${PUBLIC_KEY}" \
            -H "X-Releaf-Upload-Key: ${UPLOAD_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "releaseId": "'"${releaseId}"'",
              "fileName": "'"${fileName}"'",
              "version": "'"${version}"'",
              "name": "'"${fileName}"'",
              "platform": '"${platform}"'
            }'

          echo "✅ Chunked upload complete for release ${releaseId}"
