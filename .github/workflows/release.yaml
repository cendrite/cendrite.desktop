name: Release Electron App

on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Electron App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Electron App
        run: npm run dist:${{ matrix.os == 'windows-latest' && 'win' || matrix.os == 'macos-latest' && 'mac' || 'linux' }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: dist/

  release-windows:
    name: Release Windows
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-latest-artifact
          path: ./release/windows

      - name: Release Windows Build
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.run_number }}"
          draft: false
          prerelease: false
          files: release/windows/**/*

  release-macos:
    name: Release macOS
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-latest-artifact
          path: ./release/macos

      - name: Release macOS Build
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.run_number }}"
          draft: false
          prerelease: false
          files: release/macos/**/*

  release-linux:
    name: Release Linux
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-latest-artifact
          path: ./release/linux

      - name: Release Linux Build
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.run_number }}"
          draft: false
          prerelease: false
          files: release/linux/**/*
