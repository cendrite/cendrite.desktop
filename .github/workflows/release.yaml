name: Release Electron App

on:
  push:
    branches: [develop, master]
  pull_request_target:
    branches: [develop, master]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: windows
            os: windows-latest
            buildScript: dist:win
            glob: '*.exe'
            id: 0
          - name: macos
            os: macos-latest
            buildScript: dist:mac
            glob: '*.dmg'
            id: 1
          - name: linux
            os: ubuntu-latest
            buildScript: dist:linux
            glob: '*.AppImage'
            id: 2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron App (${{ matrix.platform.name }})
        run: npm run ${{ matrix.platform.buildScript }}

      - name: Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'pull_request_target'
            && format('pr-{0}-{1}', github.event.pull_request.number, matrix.platform.name)
            || format('v{0}', github.run_number) }}
          name:     ${{ github.event_name == 'pull_request_target'
            && format('PR #{0} — {1}', github.event.pull_request.number, matrix.platform.name)
            || format('Release v{0} — {1}', github.run_number, matrix.platform.name) }}
          draft:    ${{ github.event_name == 'pull_request_target' }}
          files:    dist/${{ matrix.platform.glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
